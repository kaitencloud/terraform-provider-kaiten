name: Feature request
description: Propose a new resource, data source or attribute
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please search the existing issues first. For a larger
        change, an issue is the place to agree on the direction before writing code.
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: The situation you are in, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: The resources, data sources or attributes, and an example configuration if you have one.
      render: terraform
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself.
